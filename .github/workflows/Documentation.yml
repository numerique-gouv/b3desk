---
name: Documentation
on:
  push:
    branches:
      - production
      - main
  pull_request:
    branches:
      - production
      - main
jobs:
  tests:
    name: ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Build documentation
        run: uv run --group doc sphinx-build documentation build/sphinx/html
