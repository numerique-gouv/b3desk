name: Check changelog

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

jobs:
  fragment:
    name: Check that a changelog fragment was added
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.labels.*.name, 'skip changelog')"
    steps:
      - name: Setup git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Look for a changelog fragment
        run: |
          added=$(git diff --name-only --diff-filter=A \
            "origin/${{ github.base_ref }}...HEAD" -- changelog.d \
            | grep -v -E 'changelog\.d/(README\.md|new_fragment\.md\.j2)$' || true)
          if [ -z "$added" ]; then
            echo "::error::Cette pull request ne contient aucun fragment de journal des modifications."
            echo "Créez-en un avec « uv run scriv create --edit », ou posez le label « skip changelog »"
            echo "si le changement est sans effet pour les personnes qui utilisent ou administrent B3Desk."
            exit 1
          fi
          echo "Fragments trouvés :"
          echo "$added"
