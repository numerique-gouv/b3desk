  # These containers are the one needed to make the app work
  # Other container are available in docker-compose.override.yml if needed
  # see documentation [link] for more info

# Logs, configuration and instance data, which every environment needs to
# read or write from the host. The application code itself is baked into the
# image, and only mounted over in development: see docker-compose.override.yml
x-app-volumes: &app-volumes
  - ./web/logs:/var/log
  - ./web/conf:/opt/bbb-visio/conf
  - ./web/instance:/opt/bbb-visio/instance

services:
  web:
    container_name: web
    build:
      context: ./web
      dockerfile: Dockerfile
      additional_contexts:
        root: .
    # env_file:
    #   - web.env
    environment:
      - FLASK_APP=b3desk
    volumes: *app-volumes
    ports:
      - 5000:5000

  worker: &celery-common
    container_name: worker
    depends_on:
      - broker
    build:
      context: ./web
      dockerfile: Dockerfile
      additional_contexts:
        root: .
    # env_file:
    #   - web.env  # to get shared REDIS_URL
    # WORKER NEEDS TO HAVE REDIS_URL ENV VAR SET, either by shared.env or web.env
    environment:
      - APP=b3desk.celery_worker
    volumes: *app-volumes
    entrypoint: []
    command: celery worker --loglevel=info

  beat:
    <<: *celery-common
    container_name: beat
    command: celery beat --loglevel=info --schedule /tmp/celerybeat-schedule --pidfile=

  broker:
    container_name: broker
    image: redis:6-alpine
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      start_period: 5s
